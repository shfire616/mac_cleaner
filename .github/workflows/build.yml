name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on tags like v1.0.0, v1.0.1, etc.

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.arch_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13    # Intel Mac
            arch_name: Intel
          - os: macos-14    # Apple Silicon (M1/M2)
            arch_name: Silicon

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller dmgbuild

      - name: Build Application (.app)
        run: |
          pyinstaller --name="MacCleaner" --windowed --noconfirm --clean --paths=src src/main.py

      - name: Build Disk Image (.dmg)
        run: |
          dmgbuild -s dmg_settings.py "MacCleaner" dist/MacCleaner.dmg

      - name: Rename Output
        run: |
          mv dist/MacCleaner.dmg dist/MacCleaner-${{ matrix.arch_name }}.dmg

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/MacCleaner-${{ matrix.arch_name }}.dmg
